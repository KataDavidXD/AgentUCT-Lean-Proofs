name: Lean proof verification

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LEAN_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build core and supplement and audit all three theorem groups
        run: python scripts/verify_proofs.py --bootstrap
      - name: Show verification report and failed build tail
        if: always()
        run: |
          if [ -f .verification/verification.json ]; then
            cat .verification/verification.json
          fi
          if [ '${{ job.status }}' != 'success' ] && [ -f .verification/lake-build.log ]; then
            tail -n 100 .verification/lake-build.log
          fi
